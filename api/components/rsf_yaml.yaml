  /recon:
    post:
      tags:
        - Collector
        - Receiver
        # - Settlement Agency
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  $ref: "#/components/schemas/Context"
                message:
                  type: object
                  properties:
                    orders:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Describes the order id
                          status:
                            type: string
                            example: "Completed"
                          quote:
                            $ref: "#/components/schemas/Quote"
                          settlements:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                counterparty_id:
                                  type: string
                                  description: "Describes the counterparty of the settlement. It should be the subscriber_id of the receiver of the payment."
                                type: #to be defined
                                  type: string
                                  enum:
                                    - SETTLEMENT
                                    - CORRECTION
                                  description: "Describes the type of settlement."
                                payment_id:
                                  type: string
                                status:
                                  type: string
                                amount:
                                  $ref: "#/components/schemas/Amount"
                                commission:
                                  $ref: "#/components/schemas/Amount"
                                withholding_amount:
                                  $ref: "#/components/schemas/Amount"
                                tcs:
                                  $ref: "#/components/schemas/Amount"
                                tds:
                                  $ref: "#/components/schemas/Amount"
                                delay_amount:
                                  $ref: "#/components/schemas/Amount"
                                updated_at:
                                  type: string
                                  format: date-time
                                settlement_ref_no:
                                  type: string
              required:
                - context
                - message
      responses:
        "200":
          description: Acknowledgement of message received
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      ack:
                        $ref: "#/components/schemas/Ack"
                    required:
                      - ack
                  error:
                    $ref: "#/components/schemas/Error"
                required:
                  - message
  /on_recon:
    post:
      tags:
        - Collector
        - Receiver
        # - Settlement Agency
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  $ref: "#/components/schemas/Context"
                message:
                  type: object
                  properties:
                    orders:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Describes the order id
                          status:
                            type: string
                            example: "Completed"
                          quote:
                            $ref: "#/components/schemas/Quote"
                          recon_accord:
                            type: boolean
                          settlements:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                counterparty_id:
                                  type: string
                                  description: "Describes the counterparty of the settlement. It should be the subscriber_id of the receiver of the payment."
                                type: #to be defined
                                  type: string
                                  enum:
                                    - SETTLEMENT
                                    - CORRECTION
                                  description: "Describes the type of settlement."
                                payment_id:
                                  type: string
                                status:
                                  type: string
                                due_date:
                                  type: string
                                  format: date
                                amount:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: "#/components/schemas/Amount"
                                commision:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: "#/components/schemas/Amount"
                                withholding_amount:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: "#/components/schemas/Amount"
                                tcs:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: "#/components/schemas/Amount"
                                tds:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: "#/components/schemas/Amount"
                                delay_amount:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: "#/components/schemas/Amount"
                                updated_at:
                                  type: string
                                  format: date-time
                                settlement_ref_no:
                                  type: string
                error:
                  $ref: "#/components/schemas/Error"
              required:
                - context
      responses:
        "200":
          description: Acknowledgement of message received
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      ack:
                        $ref: "#/components/schemas/Ack"
                    required:
                      - ack
                  error:
                    $ref: "#/components/schemas/Error"
                required:
                  - message
components:
  securitySchemes:
    SubscriberAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Signature of message body using Collector or Receiver subscriber's
        signing public key. <br/><br/>Format:<br/><br/><code>Authorization :
        Signature
        keyId="{subscriber_id}|{unique_key_id}|{algorithm}",algorithm="ed25519",created="1606970629",expires="1607030629",headers="(created)
        (expires) digest",signature="Base64(signing string)"</code>
  schemas:
    Ack:
      description: Describes the ACK response
      type: object
      properties:
        status:
          type: string
          description: >-
            Describe the status of the ACK response. If schema validation
            passes, status is ACK else it is NACK
          enum:
            - ACK
            - NACK
    Amount:
      type: object
      properties:
        currency:
          type: string
          example: "INR"
        value:
          type: string
          example: ""
    BankDetails:
      type: object
      properties:
        account_no:
          type: string
          example: ""
        ifsc_code:
          type: string
          example: ""
    Context:
      description: Describes a beckn message context
      type: object
      properties:
        domain:
          type: string
        location:
          type: object
          properties:
            country:
              type: object
              properties:
                code:
                  type: string
                  example: "IND"
            city:
              type: object
              properties:
                code:
                  type: string
                  example: "*"
        country:
          type: string
          example: "IND"
        city:
          type: string
          example: "*"
        action:
          type: string
          description: >-
            Defines the Beckn API call. Any actions other than the enumerated
            actions are not supported by Beckn Protocol
        core_version:
          type: string
          description: Version of Beckn core API specification being used
        version:
          type: string
          description: Version of Beckn core API specification being used
        bap_id:
          type: string
          description: >-
            Unique id of the BAP. By default it is the fully qualified domain
            name of the BAP
        bap_uri:
          type: string
          format: uri
          description: >-
            URI of the BAP for accepting callbacks. Must have the same domain
            name as the bap_id
        bpp_id:
          type: string
          description: >-
            Unique id of the BPP. By default it is the fully qualified domain
            name of the BPP
        bpp_uri:
          type: string
          format: uri
          description: URI of the BPP. Must have the same domain name as the bap_id
        transaction_id:
          type: string
          description: >-
            This is a unique value which persists across all API calls from
            search through confirm
        message_id:
          type: string
          description: >-
            This is a unique value which persists during a request / callback
            cycle
        timestamp:
          type: string
          format: date-time
          description: Time of request generation in RFC3339 format
        ttl:
          type: string
          description: >-
            The duration in ISO8601 format after timestamp for which this
            message holds valid
      required:
        - domain
        - action
        # - country
        # - location
        # - version
        - transaction_id
        - message_id
        - bap_id
        - bap_uri
        - timestamp
    Error:
      description: "Describes an error object that is returned by a Collector or Receiver as a response or callback to an action by another network participant. This object is sent when any request received by a network participant is unacceptable. This object can be sent either during Ack or with the callback."
      type: object
      properties:
        code:
          type: string
          description: "Standard error code. For full list of error codes, refer <a href = https://ondc-official.github.io/ONDC-NTS-Specifications/#error>here</a>"
        message:
          type: string
          description: Human readable message describing the error. Used mainly for logging. Not recommended to be shown to the user.
    Orders:
      type: array
      items:
        type: object
        properties:
          id:
            description: Describes the order id
            type: string
          inter_participant:
            description: Provides details about the settlement amount, payable/ receivable and status between the Collector and the Receiver
            type: object
            properties:
              settled_amount:
                $ref: "#/components/schemas/Amount"
              amount:
                $ref: "#/components/schemas/Amount"
              status:
                type: string
                enum:
                  - SETTLED
                  - NOT_SETTLED
              reference_no:
                type: string
              error:
                $ref: "#/components/schemas/Error"

          collector:
            description: Provides details about the amount to be retained by the collector
            type: object
            properties:
              amount:
                $ref: "#/components/schemas/Amount"
          provider:
            description: Provides details about the amount to be settled to the Provider of an NP.
            type: object
            properties:
              id:
                type: string
                example: ""
              name:
                type: string
                example: ""
              bank_details:
                $ref: "#/components/schemas/BankDetails"
              status:
                type: string
                enum:
                  - SETTLED
                  - NOT_SETTLED
              amount:
                $ref: "#/components/schemas/Amount"
              reference_no:
                type: string
              error:
                $ref: "#/components/schemas/Error"

          self:
            type: object
            description: Provides details about the amount for the NP to move to their operative account
            properties:
              amount:
                $ref: "#/components/schemas/Amount"
              status:
                type: string
                enum:
                  - SETTLED
                  - NOT_SETTLED
              reference_no:
                type: string
              error:
                $ref: "#/components/schemas/Error"
    Quote:
      type: object
      properties:
        id:
          type: string
        price:
          $ref: "#/components/schemas/Amount"
        breakup:
          type: array
          items:
            $ref: "#/components/schemas/QuoteBreakup"
        ttl:
          type: string
    QuoteBreakup:
      type: object
      properties:
        "@ondc/org/item_id":
          type: string
        "@ondc/org/item_quantity":
          $ref: "#/components/schemas/QuoteItemQuantity"
        title:
          type: string
        "@ondc/org/title_type":
          type: string
        price:
          $ref: "#/components/schemas/Amount"
        item:
          $ref: "#/components/schemas/Item"
    QuoteItemQuantity:
      type: object
      properties:
        count:
          type: integer
    Item:
      type: object
      properties:
        id:
          type: string
        parent_item_id:
          type: string
        parent_item_quantity:
          $ref: "#/components/schemas/ItemQuantity"
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        creator:
          $ref: "#/components/schemas/Organization"
        price:
          $ref: "#/components/schemas/Amount"
        category_ids:
          type: array
          items:
            type: string
        fulfillment_ids:
          type: array
          items:
            type: string
        location_ids:
          type: array
          items:
            type: string
        payment_ids:
          type: array
          items:
            type: string
        add_ons:
          type: array
          items:
            $ref: "#/components/schemas/AddOn"
        cancellation_terms:
          type: array
          items:
            $ref: "#/components/schemas/CancellationTerm"
        refund_terms:
          type: array
          items:
            $ref: "#/components/schemas/RefundTerm"
        replacement_terms:
          type: array
          items:
            $ref: "#/components/schemas/ReplacementTerm"
        return_terms:
          type: array
          items:
            $ref: "#/components/schemas/ReturnTerm"
        xinput:
          $ref: "#/components/schemas/XInput"
        time:
          $ref: "#/components/schemas/Time"
        rateable:
          type: boolean
        rating:
          type: string
        matched:
          type: boolean
        related:
          type: boolean
        recommended:
          type: boolean
        ttl:
          type: string
        quantity:
          $ref: "#/components/schemas/ItemQuantity"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    ItemQuantity:
      type: object
      properties:
        allocated:
          $ref: "#/components/schemas/ItemQuantityValue"
        available:
          $ref: "#/components/schemas/ItemQuantityFlexibleValue"
        maximum:
          $ref: "#/components/schemas/ItemQuantityFlexibleValue"
        minimum:
          $ref: "#/components/schemas/ItemQuantityFlexibleValue"
        selected:
          $ref: "#/components/schemas/ItemQuantityValue"
        unitized:
          $ref: "#/components/schemas/ItemQuantityValue"
    ItemQuantityValue:
      type: object
      properties:
        count:
          type: integer
        measure:
          $ref: "#/components/schemas/Scalar"
    ItemQuantityFlexibleValue:
      type: object
      properties:
        count:
          oneOf:
            - type: integer
            - type: string
        measure:
          $ref: "#/components/schemas/Scalar"
    Scalar:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
        estimated_value:
          type: string
        computed_value:
          type: string
        range:
          $ref: "#/components/schemas/ScalarRange"
        unit:
          type: string
    ScalarRange:
      type: object
      properties:
        min:
          type: string
        max:
          type: string
    Descriptor:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        short_desc:
          type: string
        long_desc:
          type: string
        additional_desc:
          $ref: "#/components/schemas/DescriptorAdditionalDesc"
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaFile"
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
    DescriptorAdditionalDesc:
      type: object
      properties:
        url:
          type: string
        content_type:
          type: string
    MediaFile:
      type: object
      properties:
        mimetype:
          type: string
        url:
          type: string
        signature:
          type: string
        dsa:
          type: string
    Image:
      type: object
      properties:
        url:
          type: string
        size_type:
          type: string
        width:
          type: string
        height:
          type: string
    Organization:
      type: object
      properties:
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        address:
          type: string
        state:
          $ref: "#/components/schemas/State"
        city:
          $ref: "#/components/schemas/City"
        contact:
          $ref: "#/components/schemas/Contact"
    Contact:
      type: object
      properties:
        phone:
          type: string
        email:
          type: string
        jcard:
          $ref: "#/components/schemas/JCard"
    JCard:
      type: object
      additionalProperties: true
    AddOn:
      type: object
      properties:
        id:
          type: string
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        price:
          $ref: "#/components/schemas/Amount"
    CancellationTerm:
      type: object
      properties:
        fulfillment_state:
          $ref: "#/components/schemas/FulfillmentState"
        reason_required:
          type: boolean
        cancel_by:
          $ref: "#/components/schemas/Time"
        cancellation_fee:
          $ref: "#/components/schemas/Fee"
        xinput:
          $ref: "#/components/schemas/XInput"
        external_ref:
          $ref: "#/components/schemas/MediaFile"
    RefundTerm:
      type: object
      properties:
        fulfillment_state:
          $ref: "#/components/schemas/State"
        refund_eligible:
          type: boolean
        refund_within:
          $ref: "#/components/schemas/Time"
        refund_amount:
          $ref: "#/components/schemas/Amount"
    ReplacementTerm:
      type: object
      properties:
        fulfillment_state:
          $ref: "#/components/schemas/State"
        replace_within:
          $ref: "#/components/schemas/Time"
        external_ref:
          $ref: "#/components/schemas/MediaFile"
    ReturnTerm:
      type: object
      properties:
        fulfillment_state:
          $ref: "#/components/schemas/State"
        return_eligible:
          type: boolean
        return_time:
          $ref: "#/components/schemas/Time"
        return_location:
          $ref: "#/components/schemas/Location"
        fulfillment_managed_by:
          type: string
    XInput:
      type: object
      properties:
        form:
          $ref: "#/components/schemas/Form"
        required:
          type: boolean
    Form:
      type: object
      properties:
        url:
          type: string
        data:
          type: object
          additionalProperties:
            type: string
        mime_type:
          type: string
        submission_id:
          type: string
    Time:
      type: object
      properties:
        label:
          type: string
        timestamp:
          type: string
        duration:
          type: string
        range:
          $ref: "#/components/schemas/TimeRange"
        days:
          type: string
        schedule:
          $ref: "#/components/schemas/Schedule"
    TimeRange:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
    Schedule:
      type: object
      properties:
        frequency:
          type: string
        holidays:
          type: array
          items:
            type: string
        times:
          type: array
          items:
            type: string
    Fee:
      type: object
      properties:
        percentage:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
    FulfillmentState:
      type: object
      properties:
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        updated_at:
          type: string
        updated_by:
          type: string
    Location:
      type: object
      properties:
        id:
          type: string
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        map_url:
          type: string
        gps:
          type: string
        address:
          type: string
        city:
          $ref: "#/components/schemas/City"
        district:
          type: string
        state:
          $ref: "#/components/schemas/State"
        country:
          $ref: "#/components/schemas/Country"
        area_code:
          type: string
        circle:
          $ref: "#/components/schemas/Circle"
        polygon:
          type: string
        3dspace:
          type: string
        rating:
          type: string
    State:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
    City:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
    Country:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
    Circle:
      type: object
      properties:
