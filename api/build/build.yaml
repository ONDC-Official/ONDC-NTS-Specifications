openapi: 3.0.0
info:
  title: Reconciliation and Settlement Framework (RSF) for ONDC
  description: ONDC  Reconciliation and Settlement Framework API Specification
  version: 2.1.0
security:
  - SubscriberAuth: []
paths:
  /recon:
    post:
      tags:
        - Collector
        - Receiver
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  $ref: '#/components/schemas/Context'
                message:
                  type: object
                  properties:
                    orders:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Describes the order id
                          status:
                            type: string
                            example: Completed
                          quote:
                            $ref: '#/components/schemas/Quote'
                          settlements:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                counterparty_id:
                                  type: string
                                  description: >-
                                    Describes the counterparty of the
                                    settlement. It should be the subscriber_id
                                    of the receiver of the payment.
                                type:
                                  type: string
                                  description: Describes the type of settlement.
                                payment_id:
                                  type: string
                                status:
                                  type: string
                                amount:
                                  $ref: '#/components/schemas/Amount'
                                commision:
                                  $ref: '#/components/schemas/Amount'
                                withholding_amount:
                                  $ref: '#/components/schemas/Amount'
                                tcs:
                                  $ref: '#/components/schemas/Amount'
                                tds:
                                  $ref: '#/components/schemas/Amount'
                                delay_amount:
                                  $ref: '#/components/schemas/Amount'
                                updated_at:
                                  type: string
                                  format: date-time
                                settlement_ref_no:
                                  type: string
              required:
                - context
                - message
      responses:
        '200':
          description: Acknowledgement of message received
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      ack:
                        $ref: '#/components/schemas/Ack'
                    required:
                      - ack
                  error:
                    $ref: '#/components/schemas/Error'
                required:
                  - message
  /on_recon:
    post:
      tags:
        - Collector
        - Receiver
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  $ref: '#/components/schemas/Context'
                message:
                  type: object
                  properties:
                    orders:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Describes the order id
                          status:
                            type: string
                            example: Completed
                          quote:
                            $ref: '#/components/schemas/Quote'
                          recon_accord:
                            type: boolean
                          settlements:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                counterparty_id:
                                  type: string
                                  description: >-
                                    Describes the counterparty of the
                                    settlement. It should be the subscriber_id
                                    of the receiver of the payment.
                                type:
                                  type: string
                                  description: Describes the type of settlement.
                                payment_id:
                                  type: string
                                status:
                                  type: string
                                due_date:
                                  type: string
                                  format: date
                                amount:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: '#/components/schemas/Amount'
                                commision:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: '#/components/schemas/Amount'
                                withholding_amount:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: '#/components/schemas/Amount'
                                tcs:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: '#/components/schemas/Amount'
                                tds:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: '#/components/schemas/Amount'
                                delay_amount:
                                  allOf:
                                    - type: object
                                      properties:
                                        diff_value:
                                          type: string
                                    - $ref: '#/components/schemas/Amount'
                                updated_at:
                                  type: string
                                  format: date-time
                                settlement_ref_no:
                                  type: string
                error:
                  $ref: '#/components/schemas/Error'
              required:
                - context
      responses:
        '200':
          description: Acknowledgement of message received
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      ack:
                        $ref: '#/components/schemas/Ack'
                    required:
                      - ack
                  error:
                    $ref: '#/components/schemas/Error'
                required:
                  - message
components:
  securitySchemes:
    SubscriberAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Signature of message body using Collector or Receiver subscriber's
        signing public key. <br/><br/>Format:<br/><br/><code>Authorization :
        Signature
        keyId="{subscriber_id}|{unique_key_id}|{algorithm}",algorithm="ed25519",created="1606970629",expires="1607030629",headers="(created)
        (expires) digest",signature="Base64(signing string)"</code>
  schemas:
    Ack:
      description: Describes the ACK response
      type: object
      properties:
        status:
          type: string
          description: >-
            Describe the status of the ACK response. If schema validation
            passes, status is ACK else it is NACK
          enum:
            - ACK
            - NACK
    Amount:
      type: object
      properties:
        currency:
          type: string
          example: INR
        value:
          type: string
          example: ''
    BankDetails:
      type: object
      properties:
        account_no:
          type: string
          example: ''
        ifsc_code:
          type: string
          example: ''
    Context:
      description: Describes a beckn message context
      type: object
      properties:
        domain:
          type: string
        location:
          type: object
          properties:
            country:
              type: object
              properties:
                code:
                  type: string
                  example: IND
            city:
              type: object
              properties:
                code:
                  type: string
                  example: '*'
        action:
          type: string
          description: >-
            Defines the Beckn API call. Any actions other than the enumerated
            actions are not supported by Beckn Protocol
        version:
          type: string
          description: Version of Beckn core API specification being used
        bap_id:
          type: string
          description: >-
            Unique id of the BAP. By default it is the fully qualified domain
            name of the BAP
        bap_uri:
          type: string
          format: uri
          description: >-
            URI of the BAP for accepting callbacks. Must have the same domain
            name as the bap_id
        bpp_id:
          type: string
          description: >-
            Unique id of the BPP. By default it is the fully qualified domain
            name of the BPP
        bpp_uri:
          type: string
          format: uri
          description: URI of the BPP. Must have the same domain name as the bap_id
        transaction_id:
          type: string
          description: >-
            This is a unique value which persists across all API calls from
            search through confirm
        message_id:
          type: string
          description: >-
            This is a unique value which persists during a request / callback
            cycle
        timestamp:
          type: string
          format: date-time
          description: Time of request generation in RFC3339 format
        ttl:
          type: string
          description: >-
            The duration in ISO8601 format after timestamp for which this
            message holds valid
      required:
        - domain
        - action
        - location
        - version
        - transaction_id
        - message_id
        - bap_id
        - bap_uri
        - timestamp
    Error:
      description: >-
        Describes an error object that is returned by a Collector or Receiver as
        a response or callback to an action by another network participant. This
        object is sent when any request received by a network participant is
        unacceptable. This object can be sent either during Ack or with the
        callback.
      type: object
      properties:
        code:
          type: string
          description: >-
            Standard error code. For full list of error codes, refer <a href =
            https://ondc-official.github.io/ONDC-NTS-Specifications/#error>here</a>
        message:
          type: string
          description: >-
            Human readable message describing the error. Used mainly for
            logging. Not recommended to be shown to the user.
    Orders:
      type: array
      items:
        type: object
        properties:
          id:
            description: Describes the order id
            type: string
          inter_participant:
            description: >-
              Provides details about the settlement amount, payable/ receivable
              and status between the Collector and the Receiver
            type: object
            properties:
              settled_amount:
                $ref: '#/components/schemas/Amount'
              amount:
                $ref: '#/components/schemas/Amount'
              status:
                type: string
                enum:
                  - SETTLED
                  - NOT_SETTLED
              reference_no:
                type: string
              error:
                $ref: '#/components/schemas/Error'
          collector:
            description: Provides details about the amount to be retained by the collector
            type: object
            properties:
              amount:
                $ref: '#/components/schemas/Amount'
          provider:
            description: >-
              Provides details about the amount to be settled to the Provider of
              an NP.
            type: object
            properties:
              id:
                type: string
                example: ''
              name:
                type: string
                example: ''
              bank_details:
                $ref: '#/components/schemas/BankDetails'
              status:
                type: string
                enum:
                  - SETTLED
                  - NOT_SETTLED
              amount:
                $ref: '#/components/schemas/Amount'
              reference_no:
                type: string
              error:
                $ref: '#/components/schemas/Error'
          self:
            type: object
            description: >-
              Provides details about the amount for the NP to move to their
              operative account
            properties:
              amount:
                $ref: '#/components/schemas/Amount'
              status:
                type: string
                enum:
                  - SETTLED
                  - NOT_SETTLED
              reference_no:
                type: string
              error:
                $ref: '#/components/schemas/Error'
    Quote:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Amount'
        ttl:
          type: string
        breakup:
          type: array
          items:
            type: object
            properties:
              '@ondc/org/item_id':
                type: string
              '@ondc/org/item_quantity':
                type: object
                properties:
                  count:
                    type: integer
              title:
                type: string
              '@ondc/org/title_type':
                type: string
              price:
                $ref: '#/components/schemas/Amount'
              item:
                $ref: '#/components/schemas/Item'
    Item:
      type: object
      properties:
        price:
          $ref: '#/components/schemas/Amount'
        quantity:
          type: object
          properties:
            available:
              type: object
              properties:
                count:
                  type: string
            maximum:
              type: object
              properties:
                count:
                  type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    Tag:
      type: object
      properties:
        code:
          type: string
        list:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              value:
                type: string
    Settlement:
      description: >
        - Describes the settlement of NP -NP - Describes the miscellaneous
        settlement - Describes the NIL settlement
      type: object
      properties:
        type:
          description: Describes the type of the settlement
          type: string
        id:
          description: |
            * settlement id of the settlement file
          type: string
        order:
          $ref: '#/components/schemas/Orders'
x-enum:
  settle:
    context: &ref_0
      location:
        country:
          code:
            - code: IND
              description: Represents the country
        city:
          code:
            - code: '*'
              description: city
      domain:
        - code: ONDC:NTS10
          description: RSF
    message:
      settlement:
        type: &ref_1
          - &ref_3
            code: NP-NP
            description: Interparticipant settlement
          - &ref_4
            code: MISC
            description: Miscellaneous
          - code: NIL
            description: NP Declaring no settlement required
  on_settle:
    context: *ref_0
    message:
      settlement:
        type: *ref_1
        orders: &ref_5
          inter_participant: &ref_2
            status:
              - code: SETTLED
                description: settlement successful
              - code: NOT_SETTLED
                description: settlement unsuccessful
          provider: *ref_2
          self: *ref_2
  on_report:
    context: *ref_0
    message:
      settlement:
        type:
          - *ref_3
          - *ref_4
          - code: NIL
            description: NP declaring no settlement required
        orders: *ref_5
  recon:
    context: *ref_0
    message: &ref_6
      orders:
        settlements:
          status:
            - code: SETTLED
              description: Successfully settled
            - code: PENDING
              description: Settlement awaited due to reconciliation difference between NPs
            - code: TO_BE_INITIATED
              description: Settlement to be initiated in a future settlement cycle
  on_recon:
    context: *ref_0
    message: *ref_6
x-flows:
  - summary: RECON
    details:
      - description: >-
          The reconciliation process among the NPs are facilitated through the
          recon and on_recon APIs. In case settlement instructions are shared to
          the settlement agency and it fails for certain orders due an order
          mismatch or an order amount mismatch, NPs shall leverage the recon and
          on_recon API to communicate the mismatches. <br> In case an NP
          receives an order amount mismatch error code from the settlement
          agency, the receiver initiates the /recon request to the collector
          providing the breakup details for the respective order ID(s). The
          collector then reconciles and responds with the on_recon including the
          difference amount. <br>  In case an NP receives an order id mismatch
          error code (i.e. order ID not shared by the counterparty), the NP is
          expected to call the /recon API of the respective counterparty with
          the specific order ID(s) and its breakup details. The counterparty
          then reconciles and responds with details specific to the order id
          requested. <br> In both cases, if the response is correctly reconciled
          for the requisite orders, the settlement is initiated in the next
          settlement cycle. Otherwise, NPs are expected to raise an IGM for
          resolving the differences.<br> Note: RSF Recon flow is a
          bi-directional flow where either the collector or the receiver can
          initiate the reconciliation flow. Flow below illustrates flows where
          the receiver is initiating the flow.
        mermaid: |-
          sequenceDiagram
           participant Collector
           participant Receiver
           Receiver ->> Collector : /recon API
           Collector ->> Receiver: /on_recon API
    references: if any
    steps:
      - summary: RECON
        api: recon
        details:
          - description: >-
              Reconciliation call to understand the discrepancy in the
              settlement instructions
            mermaid: |-
              sequenceDiagram
               participant Collector
               participant Receiver
               Collector ->> Receiver : /recon API
               Receiver ->> Collector: /on_recon API
               Collector ->> Receiver : /recon API
               Receiver ->> Collector: /on_recon API
        reference: if any
        example:
          value: &ref_7
            context:
              domain: ONDC:NTS10
              location:
                country:
                  code: IND
                city:
                  code: '*'
              version: 2.1.0
              action: recon
              bap_id: collector-app.com
              bap_uri: https://collector-app.com/ondc/1.0/
              bpp_id: receiver-app.com
              bpp_uri: https://receiver-app.com/ondc/
              transaction_id: bd73a366-aebb-4144-9314-808dda82c7e6
              message_id: 941ef6d7-d74d-4411-ac06-a05469c0f9ac
